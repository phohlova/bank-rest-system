server:
  port: 8080

spring:
  application:
    name: bank-rest-system

  datasource:
    url: jdbc:postgresql://localhost:5433/bank_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: false

logging:
  level:
    com.example.bankcards: DEBUG